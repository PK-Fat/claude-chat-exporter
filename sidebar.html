<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AIchat2MD</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b1210;
      color: #c9f5df;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      color: #3ddc84;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #14b8a6;
      color: #0b1210;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1fd6c1; }
    button:disabled { opacity: 0.6; cursor: default; }
    p.status {
      font-size: 12px;
      color: #8fae9e;
      margin-top: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>AIchat2MD</h1>
  <button id="exportBtn">Export this chat</button>
  <p class="status" id="status"></p>
  <script src="sidebar.js"></script>
</body>
</html>
